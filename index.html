<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guess That Leader!</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f9fafb;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .card {
      background: white;
      width: 100%;
      max-width: 420px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      padding: 24px;
    }

    h1, h2 {
      text-align: center;
      margin: 0 0 12px;
    }

    p {
      text-align: center;
      color: #555;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 10px;
      border: 1px solid #ddd;
      background: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #f3f4f6;
    }

    .primary {
      background: #22c55e;
      color: white;
      border: none;
    }

    .progress {
      height: 6px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress-fill {
      height: 100%;
      background: #22c55e;
      width: 0%;
      transition: width 0.3s ease;
    }

    .fact {
      background: #f9fafb;
      border-radius: 12px;
      padding: 14px;
      margin: 16px 0;
      text-align: center;
    }

    .muted {
      font-size: 14px;
      color: #777;
      margin-top: 12px;
    }
  </style>
</head>

<body>
  <div class="card" id="app"></div>

  <script>
    const people = [
      "Danny", "Emily", "Ellis", "Sharad",
      "Maggie", "Michelle", "Luis", "Mary", "Wes"
    ];

    const facts = [
      { text: "I once slept on the roof of my house in a sleeping bag. It was a gabled roof and I sleepwalk, so not the brightest idea.", answer: "Danny" },
      { text: "I have 30 aunts and uncles and 50 cousins", answer: "Emily" },
      { text: "My first concert was the Backstreet Boys", answer: "Ellis" },
      { text: "In my senior year, I chose math over biology because I couldn’t imagine not studying math, even though I wanted to be a doctor. Now all my friends from that time are doctors, and I’m the only engineer.", answer: "Sharad" },
      { text: "I was a TV star at 5 years old. I tap danced with my sister on a kids PBS special", answer: "Maggie" },
      { text: "I’m not a big TV watcher now, but I got really into watching The Amazing Race during the early months of pandemic lockdown in 2020. One of my goals is to be on the show—I’ve already applied once and plan to again.", answer: "Michelle" },
      { text: "Destined to be a professional soccer player until a high school injury steered them to Structural Engineering", answer: "Luis" },
      { text: "I wake up at 5 a.m. every morning, and 4 out of 7 days I help teach a 6 a.m. outdoor bootcamp class—rain or shine.", answer: "Mary" },
      { text: "When I was in kindergarten, I “married” a classmate. It didn’t last long. Sixteen years later, that classmate married my best friend, and I was in their wedding party.", answer: "Wes" },
    ];

    let shuffledFacts = [...facts].sort(() => Math.random() - 0.5);
    let currentIndex = 0;
    let guesses = {};
    let started = false;

    const app = document.getElementById("app");

    function render() {
      app.innerHTML = "";

      if (!started) {
        app.innerHTML = `
          <h1>Guess that Leader!</h1>
          <p>Match each fact to one of the leaders in our offices!</p>
          <button class="primary" onclick="startGame()">Start Game</button>
        `;
        return;
      }

      if (currentIndex >= shuffledFacts.length) {
        const score = shuffledFacts.reduce((total, fact, i) =>
          total + (guesses[i] === fact.answer ? 1 : 0), 0);

        app.innerHTML = `
          <h2>Game Complete 🎉</h2>
          <p style="font-size:20px;"><strong>Your score: ${score} / ${shuffledFacts.length}</strong></p>
        `;
        return;
      }

      const progress = ((currentIndex + 1) / shuffledFacts.length) * 100;
      const fact = shuffledFacts[currentIndex];

      app.innerHTML = `
        <div class="progress">
          <div class="progress-fill" style="width:${progress}%"></div>
        </div>

        <h2>Which person matches this fact?</h2>

        <div class="fact">${fact.text}</div>

        ${people.map(p =>
          `<button onclick="makeGuess('${p}')">${p}</button>`
        ).join("")}

        <div class="muted">Question ${currentIndex + 1} of ${shuffledFacts.length}</div>
      `;
    }

    function startGame() {
      started = true;
      render();
    }

    function makeGuess(person) {
      guesses[currentIndex] = person;
      currentIndex++;
      render();
    }

    render();
  </script>
</body>
</html>
